name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.4.18"
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run pytest -v

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --run

      # playwright.config.js defines a mobile-iphone13 project (WebKit) in
      # addition to the chromium + Pixel 5 (chromium) projects, so WebKit must
      # be installed too or every iPhone 13 test errors with "Executable
      # doesn't exist". This was the root cause of the chronic e2e red.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
