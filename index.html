<!DOCTYPE html>
<html lang="en" data-theme="schematic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SCORP Colony Dashboard</title>
    <meta name="description" content="Player-facing read of the colony. Refreshed hourly." />

    <!-- Open Graph / Discord / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SCORP Colony Dashboard" />
    <meta property="og:title" content="SCORP Colony Dashboard" />
    <meta property="og:description" content="Player-facing read of the colony. Refreshed hourly." />
    <meta property="og:url" content="https://skelly0.github.io/scorp_dashboard/" />
    <meta property="og:image" content="https://skelly0.github.io/scorp_dashboard/og-image.gif" />
    <meta property="og:image:secure_url" content="https://skelly0.github.io/scorp_dashboard/og-image.gif" />
    <meta property="og:image:type" content="image/gif" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SCORP Colony Dashboard — navy-on-cream blueprint title card with a spinning wireframe moon globe in the top-right." />

    <!-- Twitter (also picked up by some scrapers as a fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SCORP Colony Dashboard" />
    <meta name="twitter:description" content="Player-facing read of the colony. Refreshed hourly." />
    <meta name="twitter:image" content="https://skelly0.github.io/scorp_dashboard/og-image.gif" />
    <meta name="twitter:image:alt" content="SCORP Colony Dashboard — navy-on-cream blueprint title card with a spinning wireframe moon globe in the top-right." />

    <!-- Discord renders this as the left-edge accent bar -->
    <meta name="theme-color" content="#0e3a8a" />
    <script>
      // Pre-hydration theme set — avoid flash of wrong theme
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light' || t === 'schematic') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
